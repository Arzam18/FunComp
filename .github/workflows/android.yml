
name: Build FunComp Android

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "CMakeLists.txt"
      - "src/**"
      - "nets/**"
      - "third_party/**"

permissions:
  contents: write

jobs:
  build:
    name: Build ARM64 with NEON
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip file

      - name: Configure Android NDK
        shell: bash
        run: |
          set -e

          if [ -z "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            echo "::error::Android NDK was not found."
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

          test -f "$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake"

      - name: Configure ARM64 build
        shell: bash
        run: |
          set -o pipefail

          cmake -S . -B build-android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=23 \
            -DARCH:STRING= \
            -DNATIVE=OFF \
            -DLTO=ON \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG" \
            2>&1 | tee configure.log

      - name: Verify target architecture
        shell: bash
        run: |
          set -e

          grep -E 'ANDROID_ABI:|CMAKE_ANDROID_ARCH_ABI:|ARCH:' \
            build-android/CMakeCache.txt || true

          if grep -n -- '-march=x86-64' build-android/build.ninja; then
            echo "::error::An x86 architecture flag remains in the build."
            exit 1
          fi

          echo "Checking compiler target..."
          grep -m 3 -E -- '--target=aarch64|--target=arm64' \
            build-android/build.ninja || true

      - name: Build engine and capture errors
        shell: bash
        run: |
          set +e

          cmake --build build-android --parallel 2 \
            > build.log 2>&1

          result=$?

          if [ "$result" -eq 0 ]; then
            echo "Build succeeded."
            tail -n 30 build.log
            exit 0
          fi

          echo "::error::FunComp Android compilation failed."
          echo "========== ERRORS =========="

          grep -n -i -B 4 -A 8 -E \
            'error:|fatal error:|undefined reference|undefined symbol|ld\.lld:|FAILED:|CMake Error|No rule to make target|ninja: build stopped|cannot find|not found' \
            build.log | head -n 200 || true

          echo "========== LAST 50 LINES =========="
          tail -n 50 build.log

          exit "$result"

      - name: Verify engine binary
        if: success()
        shell: bash
        run: |
          set -e

          test -f build-android/chess
          file build-android/chess

          if ! file build-android/chess | grep -q 'ARM aarch64'; then
            echo "::error::The generated executable is not ARM64."
            exit 1
          fi

          echo "Android ARM64 binary verified."
          echo "Skipping benchmark execution on Ubuntu because this is an Android executable."

      - name: Package Android binary
        if: success()
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp build-android/chess release/funcomp-android-arm64

          cd release

          sha256sum funcomp-android-arm64 > SHA256SUMS.txt

          zip funcomp-android-arm64.zip \
            funcomp-android-arm64 SHA256SUMS.txt

      - name: Upload Android binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FunComp-Android-ARM64
          path: |
            release/funcomp-android-arm64
            release/funcomp-android-arm64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FunComp-build-diagnostics
          path: |
            configure.log
            build.log
            build-android/CMakeCache.txt
            build-android/build.ninja
          if-no-files-found: ignore

      - name: Publish GitHub release
        if: success() && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: FunComp Android Build ${{ github.run_number }}
          files: |
            release/funcomp-android-arm64
            release/funcomp-android-arm64.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
