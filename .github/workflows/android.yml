
name: Build FunComp Android

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "CMakeLists.txt"
      - "src/**"
      - "nets/**"
      - "third_party/**"

permissions:
  contents: write

jobs:
  build:
    name: Build ARM64 with NEON
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK toolchain:"
          test -f "$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake"

      - name: Check embedded network
        run: |
          if [ -f nets/funcomp-3.0.nnue ]; then
            echo "FunComp NNUE network found."
          else
            echo "::warning::nets/funcomp-3.0.nnue not found. The engine will build without an embedded network."
          fi

      - name: Configure ARM64 build
        run: |
          cmake -S . -B build-android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_API=24 \
            -DCMAKE_CXX_STANDARD=23 \
            -DARCH= \
            -DNATIVE=OFF \
            -DLTO=ON \
            -DEMBED_NET="$PWD/nets/funcomp-3.0.nnue" \
            -DCMAKE_C_FLAGS="-O3" \
            -DCMAKE_CXX_FLAGS="-O3 -march=armv8-a+simd"

      - name: Build engine
        run: |
          cmake --build build-android --parallel 2

      - name: Verify executable
        run: |
          test -x build-android/chess
          file build-android/chess
          build-android/chess bench

      - name: Package Android binary
        run: |
          mkdir -p release
          cp build-android/chess release/funcomp-android-arm64
          cd release
          sha256sum funcomp-android-arm64 > SHA256SUMS.txt
          zip funcomp-android-arm64.zip funcomp-android-arm64 SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FunComp-Android-ARM64
          path: |
            release/funcomp-android-arm64
            release/funcomp-android-arm64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: FunComp Android Build ${{ github.run_number }}
          files: |
            release/funcomp-android-arm64
            release/funcomp-android-arm64.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
